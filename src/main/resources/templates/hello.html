<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org">
<!--xmlns는 문서를 위한 네임스페이스(이름이 존재하는 공간)를 명시하며, th 속성은 이 문서에 thymeleaf의 속성을 사용할 수 있도록 도와주는 역할을 합니다. 즉, 이 html 문서에서 해당 속성의 기능을 사용하기 위해 명시해놓는 것입니다.-->
<head>
    <title>hello</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>
<p th:text="'안녕하세요. ' + ${data}" >안녕하세요. 손님</p>
<!--th:text 속성은 텍스트의 내용을 동적으로 결정하며, 뒤의 텍스트와 결합하여 최종적으로 출력할 텍스트를 생성하여 줍니다.-->
</body>
</html>

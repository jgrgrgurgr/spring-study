<!DOCTYPE HTML>
<html>
<head>
    <title>hello</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <!--http-equiv 속성은, content 값에 명시된 HTTP 헤더를 제공합니다. 시뮬레이션을 할 때 사용하며, 해당 속성은 사용하기 위해서는 content 또한 명시돠어 있어야 합니다.-->
</head>
<body>
Hello
<a href="/hello">hello</a>
<!--같은 페이지에서 명시된 id를 가지고 있는 요소와 연결합니다.-->
</body>
</html>
